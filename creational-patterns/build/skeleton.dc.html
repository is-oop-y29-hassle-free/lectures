<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
@font-face{font-family:"Golos Text";src:url("fonts/GolosText-Regular.ttf") format("truetype");font-weight:400}
@font-face{font-family:"Golos Text";src:url("fonts/GolosText-Medium.ttf") format("truetype");font-weight:500}
@font-face{font-family:"Golos Text";src:url("fonts/GolosText-SemiBold.ttf") format("truetype");font-weight:600}
@font-face{font-family:"Golos Text";src:url("fonts/GolosText-Bold.ttf") format("truetype");font-weight:700}
:root{--ac:#1340A8;--ac-t:#E4EBFA;--wr:#A8141C;--wr-t:#FBE4E4;--ink:#111111;--ink2:#333333;--ln:#C4C4C4;--code:#F2F2EF;--t-hero:120px;--t-title:60px;--t-key:38px;--t-body:34px;--t-def:44px;--t-small:26px;--t-note:24px;--pad-x:100px;--pad-top:80px;--gap-title:24px;--gap-item:28px;--mono:"JetBrains Mono",Consolas,monospace;--sans:"Golos Text",system-ui,sans-serif}
html,body{margin:0;background:#fff;color:#111;font-family:"Golos Text",system-ui,sans-serif}
a{color:var(--ac)}a:hover{color:var(--ink)}
</style>
</helmet>
<x-import component-from-global-scope="deck-stage" from="./deck-stage.js" width="1920" height="1080" hint-size="100%,100%">
<section data-label="1">placeholder</section>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Тёмно-синий&quot;,&quot;Тёмно-зелёный&quot;],&quot;default&quot;:&quot;Тёмно-синий&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cppNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;cornerIndicator&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  componentDidMount() { this.apply(); setTimeout(() => this.apply(), 500); }
  componentDidUpdate() { this.apply(); }
  apply() {
    const acc = { "Тёмно-синий": ["#1340A8", "#E4EBFA"], "Тёмно-зелёный": ["#0B6B3A", "#E1F1E7"] }[this.props.accent ?? "Тёмно-синий"] || ["#1340A8", "#E4EBFA"];
    const r = document.documentElement.style;
    r.setProperty("--ac", acc[0]); r.setProperty("--ac-t", acc[1]);
    const showCpp = this.props.cppNotes ?? true;
    document.querySelectorAll("[data-cpp]").forEach(e => { e.style.display = showCpp ? "" : "none"; });
    const showInd = this.props.cornerIndicator ?? true;
    document.querySelectorAll("[data-mini-ind]").forEach(e => { e.style.visibility = showInd ? "" : "hidden"; });
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
